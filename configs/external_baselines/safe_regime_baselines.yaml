# Main-table safe-regime baselines. Logged nominal replay is a control and is
# intentionally not counted among the six external methods.
external_baselines:
  baseline: gameformer_lite
  methods:
    - gameformer_lite
    - plantf
    - pluto
    - pdm_closed
    - pdm_hybrid
    - idm
  max_candidates: 24
  policy:
    risk_dt: 0.1
    risk_clearance_buffer_m: 0.75
    risk_clearance_scale_m: 2.0
    risk_collision_temperature_m: 0.8
    risk_severity_speed_mps: 12.0
    backup_deceleration_mps2: 5.0
    backup_reaction_time_s: 0.25
    cvar_alpha: 0.20
    pdm_progress_weight: 5.0
    pdm_ttc_weight: 5.0
    pdm_comfort_weight: 2.0
    pdm_deviation_weight: 0.20
    pdm_backup_margin_weight: 0.10
    pdm_collision_probability_gate: 0.45
    pdm_min_clearance_gate_m: -0.25
    idm_max_accel_mps2: 1.5
    idm_comfort_decel_mps2: 2.0
    idm_time_headway_s: 1.5
    idm_min_gap_m: 2.0
    idm_target_speed_mps: 13.0
    idm_accel_exponent: 4.0
    idm_collision_probability_gate: 0.55
    idm_accel_tracking_weight: 1.0
    idm_deviation_weight: 0.10
    idm_risk_weight: 1.5
    idm_utility_weight: 0.15
